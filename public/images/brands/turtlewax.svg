<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60" aria-label="Turtle Wax Logo">
  <rect width="220" height="60" fill="transparent"/>
  <!-- Turtle Emblem -->
  <g transform="translate(10, 10)">
    <!-- Shell -->
    <path d="M20 2 C10 2, 2 10, 2 20 C2 30, 10 38, 20 38 C30 38, 38 30, 38 20 C38 10, 30 2, 20 2 Z" fill="#007A3D"/>
    <!-- Shell Pattern Lines -->
    <path d="M12 12 L28 12 L32 20 L28 28 L12 28 L8 20 Z" fill="#005A2B"/>
    <circle cx="20" cy="20" r="5" fill="#A8CF45"/>
    <!-- Head -->
    <circle cx="20" cy="-1" r="5" fill="#007A3D"/>
    <!-- Legs -->
    <circle cx="4" cy="8" r="3.5" fill="#007A3D"/>
    <circle cx="36" cy="8" r="3.5" fill="#007A3D"/>
    <circle cx="4" cy="32" r="3.5" fill="#007A3D"/>
    <circle cx="36" cy="32" r="3.5" fill="#007A3D"/>
  </g>
  <!-- Wordmark -->
  <text x="64" y="28" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#007A3D" letter-spacing="1px">TURTLE</text>
  <text x="64" y="46" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="800" font-size="16" fill="#1B1C1D" letter-spacing="3px">WAX</text>
</svg>
